# pipelinebyalex — central reusable pipeline.
#
# App repos call this with a tiny caller and commit a declarative `pba.yml`.
# This workflow checks out the caller repo, reads its pba.yml at runtime via the
# `pba` tool, and fans out CI + deploy from it. Nobody generates anything
# locally. See docs/runtime-interpreter-plan.md.
name: pba pipeline

on:
  workflow_call:
    inputs:
      pba_ref:
        description: Which pipelinebyalex ref the interpreter runs from.
        type: string
        default: v1
      config:
        description: Path to the declarative config in the caller repo.
        type: string
        default: pba.yml
    secrets:
      PBA_READ_TOKEN:
        description: Optional token for a private PipelineByAlex repository.
        required: false
      FLY_API_TOKEN:
        required: false
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      EXPO_TOKEN:
        required: false
      DATABASE_URL:
        required: false
      DIRECT_URL:
        required: false

permissions:
  contents: read

jobs:
  # ── plan: run the interpreter once, emit matrices + deploy script ─────────
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      components: ${{ steps.p.outputs.components }}
      gates: ${{ steps.p.outputs.gates }}
      deploy_enabled: ${{ steps.p.outputs.deploy_enabled }}
      deploy_environment: ${{ steps.p.outputs.deploy_environment }}
      deploy_script: ${{ steps.p.outputs.deploy_script }}
      deploy_needs_db: ${{ steps.p.outputs.deploy_needs_db }}
      deploy_pnpm: ${{ steps.p.outputs.deploy_pnpm }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - name: Checkout app repo (has pba.yml)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout pba interpreter
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: AGY-LLC/pipelinebyalex
          ref: ${{ inputs.pba_ref }}
          path: .pba-tool
          persist-credentials: false
          # Public central repo / same-repo self-test: github.token works.
          # Private central repo: set an org secret PBA_READ_TOKEN (a PAT or App
          # token with Contents:read) and it's used instead — define once at the
          # org, never per repo.
          token: ${{ secrets.PBA_READ_TOKEN || github.token }}

      # Pinned to the interpreter's own pnpm — this job installs .pba-tool's deps,
      # not the caller's. Read the version from .pba-tool's OWN packageManager
      # rather than a bare `version:` input: this job's cwd is the caller repo's
      # root, so a bare version would collide with the caller's root
      # packageManager ("Multiple versions of pnpm specified") for any caller
      # that pins one. Pointing at the interpreter's package.json decouples the
      # interpreter's pnpm from whatever (if anything) the caller pins.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: .pba-tool/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Install interpreter
        working-directory: .pba-tool
        run: pnpm install --frozen-lockfile

      - name: Plan
        id: p
        # event + base-ref let the interpreter decide which gates apply (e.g. a
        # PR-only append-only check, or a preflight scoped to PRs into staging).
        run: >-
          node .pba-tool/bin/pba.mjs plan
          --config "${{ inputs.config }}"
          --ref "$GITHUB_REF"
          --event "${{ github.event_name }}"
          --base-ref "${{ github.base_ref }}"

  # ── test: one job per component, fanned out from the plan ────────────────
  test:
    needs: plan
    if: ${{ needs.plan.outputs.components != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
    runs-on: ${{ matrix.component.runner }}
    timeout-minutes: 30
    services:
      postgres:
        # An empty image disables the service; most components need no DB.
        image: ${{ matrix.component.needs_db && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        if: ${{ matrix.component.setup == 'node' }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # From the config's defaults.pnpm; "" → action-setup reads packageManager.
          version: ${{ matrix.component.pnpm }}
      - name: Setup Node
        if: ${{ matrix.component.setup == 'node' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.component.node }}
          cache: ${{ matrix.component.cache_path != '' && 'pnpm' || '' }}
          cache-dependency-path: ${{ matrix.component.cache_path }}
      - name: Setup Python
        if: ${{ matrix.component.setup == 'python' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.component.python }}
      - name: Run ${{ matrix.component.id }}
        # Decode to a FILE, then run the file. Piping the script into `bash`
        # makes the script bash's stdin, which any daemon the script starts
        # (adb, ssh, docker) inherits and can consume — bash then hits EOF
        # early and exits 0 with most of the script never executed, so the job
        # goes green having silently skipped its work. Seen live: an emulator
        # suite that stopped at `adb start-server` and still passed.
        env:
          PBA_SCRIPT_B64: ${{ matrix.component.script_b64 }}
        run: |
          printf '%s' "$PBA_SCRIPT_B64" | base64 -d > "$RUNNER_TEMP/pba-component.sh"
          bash "$RUNNER_TEMP/pba-component.sh"

  # ── gates: one job per gate, fanned out from the plan ────────────────────
  gates:
    needs: plan
    if: ${{ needs.plan.outputs.gates != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.plan.outputs.gates) }}
    runs-on: ${{ matrix.gate.runner }}
    timeout-minutes: 30
    # A gate may bind a GitHub Environment (e.g. a live staging-DB preflight) to
    # read that environment's secrets / honor its rules. Empty string = none.
    environment: ${{ matrix.gate.environment }}
    services:
      postgres:
        # An empty image disables the service; audit/command gates stay lean.
        image: ${{ matrix.gate.needs_db && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
      # DATABASE_URL / DIRECT_URL resolve from the bound Environment when a gate
      # sets `environment` (else empty). BASE_REF is the PR target branch, used
      # by append-only / merge-base checks.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # 0 = full history (merge-base / append-only diffs); 1 = shallow.
          fetch-depth: ${{ matrix.gate.fetch_depth }}
          persist-credentials: false
      - name: Setup pnpm
        if: ${{ matrix.gate.setup == 'node' }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # From the config's defaults.pnpm; "" → action-setup reads packageManager.
          version: ${{ matrix.gate.pnpm }}
      - name: Setup Node
        if: ${{ matrix.gate.setup == 'node' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.gate.node }}
          cache: ${{ matrix.gate.cache_path != '' && 'pnpm' || '' }}
          cache-dependency-path: ${{ matrix.gate.cache_path }}
      - name: Setup Python
        if: ${{ matrix.gate.setup == 'python' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.gate.python }}
      - name: Run ${{ matrix.gate.id }}
        # Decode to a file first — see the component job's note above.
        env:
          PBA_SCRIPT_B64: ${{ matrix.gate.script_b64 }}
        run: |
          printf '%s' "$PBA_SCRIPT_B64" | base64 -d > "$RUNNER_TEMP/pba-gate.sh"
          bash "$RUNNER_TEMP/pba-gate.sh"

  # ── verify: stable aggregate check for branch protection ─────────────────
  verify:
    needs: [plan, test, gates]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - name: Enforce required outcomes
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          GATES_RESULT: ${{ needs.gates.result }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$PLAN_RESULT" = "success" ] || {
            echo "Plan result must be success; got $PLAN_RESULT" >&2
            exit 1
          }
          for result in "$TEST_RESULT" "$GATES_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "CI prerequisite must be success or skipped; got $result" >&2; exit 1 ;;
            esac
          done

  # ── deploy: ordered chain for the ref, gated on aggregate verify ─────────
  deploy:
    needs: [plan, verify]
    # Wait for the stable aggregate check. Cancelled, failed, or timed-out
    # prerequisites can never reach this job; skipped deploy refs stay inert.
    if: >-
      ${{ always() && needs.plan.result == 'success'
          && needs.verify.result == 'success'
          && needs.plan.outputs.deploy_enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.plan.outputs.deploy_environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    # Shadow DB lets a prisma-migrate target with `render_sql` replay migrations
    # to print the pending SQL before applying. Unused by other targets.
    services:
      postgres:
        # Start the shadow DB only when the selected deploy chain migrates.
        image: ${{ needs.plan.outputs.deploy_needs_db == 'true' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # DATABASE_URL / DIRECT_URL come from the bound Environment's secrets.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # From the config's defaults.pnpm; "" → action-setup reads packageManager.
          version: ${{ needs.plan.outputs.deploy_pnpm }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Deploy
        run: ${{ needs.plan.outputs.deploy_script }}
