# ─────────────────────────────────────────────────────────────────────────
# GENERATED FROM pba.yml — DO NOT EDIT BY HAND.
# Edit pba.yml and run `pba generate`. CI runs `pba check` to fail on drift.
# ─────────────────────────────────────────────────────────────────────────

name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  tool:
    name: Tool (install + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - name: Install deps
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: .
        run: pnpm run typecheck
      - name: Test
        working-directory: .
        run: pnpm test
  drift:
    name: Workflow drift check (pba check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - name: Install deps (.)
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Workflow drift check (pba check)
        run: pnpm check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
