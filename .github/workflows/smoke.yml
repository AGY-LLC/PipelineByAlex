# pipelinebyalex — central reusable SMOKE workflow.
#
# Manual / on-demand staging e2e suites that run against a DEPLOYED environment,
# typically on a self-hosted runner (a macOS box with simulators for a Maestro
# device suite). App repos add a tiny workflow_dispatch caller and declare the
# suites under `smoke:` in pba.yml. Because the trigger is manual, a repo can
# commit this before any runner exists — it stays inert until dispatched.
name: pba smoke

on:
  workflow_call:
    inputs:
      pba_ref:
        description: Which pipelinebyalex ref the interpreter runs from.
        type: string
        default: v1
      config:
        description: Path to the declarative config in the caller repo.
        type: string
        default: pba.yml
      suite:
        description: Run only this smoke suite by name (empty = all suites).
        type: string
        default: ""
      timeout_minutes:
        description: Per-suite job timeout. Raise for suites that build from source.
        type: number
        default: 90
    secrets:
      PBA_READ_TOKEN:
        required: false
      STAGING_API_URL:
        required: false
      STAGING_APP_URL:
        required: false
      PRODUCTION_APP_URL:
        required: false
      TEST_PHONE:
        required: false
      TEST_OTP:
        required: false
      DATABASE_URL:
        required: false
      DIRECT_URL:
        required: false
      EXPO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # ── plan: interpret pba.yml → smoke matrix ───────────────────────────────
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      smoke: ${{ steps.p.outputs.smoke }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - name: Checkout app repo (has pba.yml)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Checkout pba interpreter
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: AGY-LLC/pipelinebyalex
          ref: ${{ inputs.pba_ref }}
          path: .pba-tool
          persist-credentials: false
          token: ${{ secrets.PBA_READ_TOKEN || github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: .pba-tool/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install interpreter
        working-directory: .pba-tool
        run: pnpm install --frozen-lockfile

      - name: Plan smoke
        id: p
        run: >-
          node .pba-tool/bin/pba.mjs plan
          --config "${{ inputs.config }}"
          --suite "${{ inputs.suite }}"

  # ── smoke: one job per suite, on its (self-hosted) runner ────────────────
  smoke:
    needs: plan
    if: ${{ needs.plan.outputs.smoke != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.smoke) }}
    runs-on: ${{ matrix.suite.runner }}
    # Device suites that build the app from source on the runner (expo prebuild
    # + xcodebuild / Gradle) blow past 45 min on a cold cache — a first Android
    # Gradle build on an Intel Mac alone can take ~30. The runner is self-hosted,
    # so a longer ceiling costs no billed minutes; it only bounds a hung job.
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Bind a deployed environment (its secrets / reviewers) when the suite asks.
    environment: ${{ matrix.suite.environment }}
    # Conventional secret passthrough for staging e2e / device suites. An unset
    # secret resolves to empty (harmless). Name app secrets to match these, or
    # extend this block for a new credential.
    env:
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
      PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
      TEST_PHONE: ${{ secrets.TEST_PHONE }}
      TEST_OTP: ${{ secrets.TEST_OTP }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        if: ${{ matrix.suite.setup == 'node' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        if: ${{ matrix.suite.setup == 'node' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.suite.node }}
          cache: ${{ matrix.suite.cache_path != '' && 'pnpm' || '' }}
          cache-dependency-path: ${{ matrix.suite.cache_path }}
      - name: Setup Python
        if: ${{ matrix.suite.setup == 'python' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.suite.python }}
      - name: Run ${{ matrix.suite.id }}
        # Decode to a FILE, then run the file. Piping the script into `bash`
        # makes the script bash's stdin, which any daemon the suite starts
        # (adb, ssh, simulator helpers) inherits and can consume — bash then
        # hits EOF early and exits 0 with most of the suite never executed, so
        # the run goes green having silently skipped its checks. Seen live: an
        # Android suite that stopped at `adb start-server` and still passed.
        # Device suites are the worst place for a false green, hence the fix.
        env:
          PBA_SCRIPT_B64: ${{ matrix.suite.script_b64 }}
        run: |
          printf '%s' "$PBA_SCRIPT_B64" | base64 -d > "$RUNNER_TEMP/pba-suite.sh"
          bash "$RUNNER_TEMP/pba-suite.sh"
